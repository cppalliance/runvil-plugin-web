[workspace]
resolver = "3"
# Named one by one: `crates/harness-gateway-client` holds source files and
# no manifest, and a `crates/*` glob fails on a directory without one.
members = ["crates/plugin-web", "crates/build-checks"]

[workspace.package]
edition = "2024"
license = "BSL-1.0"

[workspace.dependencies]
# The Plugin SDK at contract 0.6, pinned to a commit. A Host loads this
# Plugin only when its Harness speaks the same contract version.
runvil-plugin-sdk = { version = "0.6.0", git = "https://github.com/cppalliance/runvil-plugin-api", rev = "74f9e08ba9cc524520fb4c90bd8ac372ba7f303f" }
# The HTTP client, over rustls with one crypto backend, aws-lc-rs. reqwest
# 0.13 has no feature that picks `ring`, and CI checks that `ring` stays
# out of the workspace's normal dependency graph. Root certificates come
# from the OS trust store through the platform verifier (the `rustls`
# feature's default), not from a bundled Mozilla list. `gzip` and `brotli`
# decode a compressed body, `json` writes and reads a JSON body, and
# `system-proxy` reads the proxies of the Windows registry and of macOS
# for a client that takes a proxy.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "brotli", "system-proxy"] }
# The Plugin owns the runtime its requests run on. `net` is the I/O driver
# a socket needs, and `time` is the timer a timeout needs.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
# A call's arguments arrive as JSON text.
serde_json = "1"
# The fetch policy. `url` parses the URL a call names. `ipnet` holds the
# ranges of addresses a fetch never reaches, and 2.10 is its first release
# with the constructors that build the table of them as a constant.
url = "2"
ipnet = "2.10"
# The fetch tool's rendering of a response. `mime` reads its content type,
# `encoding_rs` decodes its body under the charset it declares,
# `readabilityrs` picks the article out of an HTML page, and `htmd`
# renders HTML to markdown.
mime = "0.3"
encoding_rs = "0.8"
readabilityrs = "0.1"
htmd = "0.5"
# Derives the fetch tool's error types.
thiserror = "2"
# What the search sources under `crates/plugin-web/src` and
# `crates/harness-gateway-client/src` are written against. `lib.rs`
# declares none of those files as a module, so no crate inherits this
# entry.
serde = { version = "1", features = ["derive"] }
# Dev-only, for the fetch tool's tests: the mock servers they send real
# requests to, and the compressed and streamed bodies those serve.
axum = "0.8"
flate2 = "1"
futures-util = "0.3"
# Dev-only: opens the built library in the example, as a Host's loader
# opens it.
libloading = "0.8"
# Parses this workspace's sources for the type-size check; `full` is the
# feature that parses items.
syn = { version = "3", features = ["full"] }
# `span-locations` makes a span parsed outside a proc macro report its line,
# which the type-size check prints with every violation.
proc-macro2 = { version = "1", features = ["span-locations"] }
tempfile = "3"

# The dylint libraries `cargo dylint --all` runs. The lints live in their
# own repository, shared across the runvil project, because they build on
# their own nightly with `rustc_private`. Moving to a newer lint set is a
# change of `rev`.
[workspace.metadata.dylint]
libraries = [{ git = "https://github.com/cppalliance/dylints", rev = "982b297ede90d37cdf8f3bf9995d1d706dcc51d4" }]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
unescaped_backticks = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
exit = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
# Cherry-picked out of pedantic: it flags product names (Runvil, OpenAI) in
# prose, which reads worse backticked than the lint is worth.
doc_markdown = "allow"
# Cherry-picked out of pedantic: its suggested rewrite for a collection is
# `assert_eq!(x, [] as [T; 0])`, which has to spell out the element type and
# needs `T: PartialEq + Debug`, so it cannot be applied to most call sites.
assert_is_empty = "allow"
