[package]
name = "plugin-web"
version = "0.1.0"
description = "The web Plugin for runvil: a tool that searches the web and a tool that fetches a page from it"
edition.workspace = true
license.workspace = true
publish = false

# A dynamic library for a Host's Plugin directory, and an rlib, so a Host
# can also link the Plugin in with `dll` off.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The Plugin contract's safe layer: the `Plugin` and `Pack` traits, what a
# tool call is lent, and the entry point.
runvil-plugin-sdk.workspace = true
# The HTTP client every fetch and every search goes through.
reqwest.workspace = true
# The runtime that runs every request.
tokio.workspace = true
# A call's arguments and the Host's resources arrive as JSON text, a
# tool's parameter schema is JSON, and a search sends and answers JSON.
serde_json.workspace = true
# Derives the types the search tool reads and writes as JSON: its
# arguments, which are also the Gateway's request, the Gateway's reply,
# and the entry of the Host's resources that names the Gateway.
serde.workspace = true
# The fetch policy: `url` parses the URL a call names, and `ipnet` holds
# the ranges of addresses a fetch never reaches.
url.workspace = true
ipnet.workspace = true
# The rendering of a response: `mime` reads its content type,
# `encoding_rs` decodes its body, `readabilityrs` picks the article out of
# an HTML page, and `htmd` renders HTML to markdown. `html5ever` and
# `markup5ever_rcdom` parse the page so its links can be made absolute
# before either renders it.
mime.workspace = true
encoding_rs.workspace = true
readabilityrs.workspace = true
htmd.workspace = true
html5ever.workspace = true
markup5ever_rcdom.workspace = true
# Derives the fetch tool's error types.
thiserror.workspace = true

[dev-dependencies]
# `testing`, the fake Host, which the tests and the example load the
# Plugin through.
runvil-plugin-sdk = { workspace = true, features = ["test-support"] }
# Opens the built library in the example.
libloading.workspace = true
# The mock servers the tests of both tools send real requests to.
axum.workspace = true
# The gzip body one of the fetch tool's servers answers with.
flate2.workspace = true
# The bodies those servers stream: one that never ends, and one that
# fails midway.
futures-util.workspace = true
# The own tests of each tool run it on the runtime of a `#[tokio::test]`.
# `macros` is that attribute and `select!`, `io-util` reads and writes the
# socket of a mock that speaks raw TCP, and `sync` is the channel such a
# mock reports through.
tokio = { workspace = true, features = ["macros", "io-util", "sync"] }

[features]
default = ["dll"]
# Exports `runvil_plugin`. A Host that links this crate in turns it off,
# because two linked Plugins exporting the symbol cannot share one binary.
dll = []

[lints]
workspace = true
